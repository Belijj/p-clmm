[package]
name = "p-clmm"
version = "0.1.0"
edition = "2024"
description = "Compute-optimized CLMM on Pinocchio + p-token."

[lib]
crate-type = ["cdylib", "lib"]
name = "p_clmm"

[features]
default = []
no-entrypoint = []
cpi = ["no-entrypoint"]
devnet = []
enable-log = []

[dependencies]
pinocchio = "0.7"
pinocchio-pubkey = "0.2"
pinocchio-system = "0.2"
pinocchio-token = "0.4"

bytemuck = { version = "1.19", features = ["derive", "min_const_generics"] }
arrayref = "0.3"

uint = { git = "https://github.com/raydium-io/parity-common", package = "uint" }

[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
litesvm = "0.6"
solana-sdk = "2"
quickcheck = "0.9"
proptest = "1"
rand = "0.8"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = true

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
